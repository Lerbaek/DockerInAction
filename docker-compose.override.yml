services:
  client:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080"
      - "8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
  server:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080"
      - "8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
  rabbitmq:
    image: remote-docker-hub.artifactory.danskenet.net/rabbitmq:4.0.9-management
    user: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q check_running
      interval: 1s
      timeout: 3s
      retries: 30
